networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  nginx_logs:
  app_logs:

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi-service/DockerFile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        SERVICE_PORT: ${SERVICE_PORT}
        WORKERS_COUNT: ${WORKERS_COUNT}
    container_name: fastapi-service
    hostname: fastapi-service
    env_file:
      - .env
    image: fastapi-service
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"
    networks:
      - app-network
    depends_on:
      - db
      - rustfs
      - redis_db
    volumes:
      - app_logs:/var/log/webapp
    command: ./start.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVICE_PORT}/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis_db:
    image: redis:${REDIS_VERSION}
    networks:
      - app-network
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    container_name: redis_db
    hostname: redis_db
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:${POSTGRES_VERSION}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d/
    networks:
      - app-network
    container_name: db
    hostname: db
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  celery:
    image: fastapi-service
    command: celery -A src.celery worker --loglevel=info
    container_name: celery
    hostname: celery
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - redis_db
      - db
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    hostname: nginx
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    profiles:
      - nginx

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    hostname: certbot
    networks:
      - app-network
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    profiles:
      - nginx

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: rustfs
    hostname: rustfs
    networks:
      - app-network
    ports:
      - ${S3_PORT}:${S3_PORT}
      - ${RUSTFS_CONSOLE_PORT}:${RUSTFS_CONSOLE_PORT}
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_ACCESS_KEY}
      - RUSTFS_ADDRESS=:${S3_PORT}
      - RUSTFS_CONSOLE_ADDRESS=:${RUSTFS_CONSOLE_PORT}
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:${S3_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  createbuckets:
    image: amazon/aws-cli:latest
    networks:
      - app-network
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      if [ -z '${S3_BUCKET}' ]; then exit 0; fi;
      aws --endpoint-url http://rustfs:${S3_PORT} s3api head-bucket --bucket ${S3_BUCKET} 2>/dev/null ||
      aws --endpoint-url http://rustfs:${S3_PORT} s3 mb s3://${S3_BUCKET};
      exit 0;
      "
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
